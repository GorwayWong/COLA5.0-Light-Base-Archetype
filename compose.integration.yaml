services:
  backend:
    build:
      target: test
    command: ["./mvnw", "-B", "verify", "-Pintegration"]
    environment:
      SPRING_PROFILES_ACTIVE: integration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tolink_test
      SPRING_DATASOURCE_USERNAME: tolink
      SPRING_DATASOURCE_PASSWORD: tolink_test_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      TOLINK_AGENT_ENABLED: "false"
      TOLINK_STORAGE_OSS_ENABLED: "false"
    ports: !reset []

  postgres:
    environment:
      POSTGRES_DB: tolink_test
      POSTGRES_USER: tolink
      POSTGRES_PASSWORD: tolink_test_password
