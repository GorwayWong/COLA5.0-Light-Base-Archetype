spring:
  application:
    name: tolink
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tolink}
    username: ${SPRING_DATASOURCE_USERNAME:tolink}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
  flyway:
    enabled: true
    default-schema: tolink
    schemas: tolink
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:2s}

mybatis-plus:
  config-location: classpath:mybatis-config.xml
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

tolink:
  agent:
    enabled: ${TOLINK_AGENT_ENABLED:false}
    name: ${TOLINK_AGENT_NAME:tolink-agent}
    system-prompt: ${TOLINK_AGENT_SYSTEM_PROMPT:ToLink infrastructure agent}
  storage:
    oss:
      enabled: ${TOLINK_STORAGE_OSS_ENABLED:false}
      region: ${TOLINK_OSS_REGION:}
      endpoint: ${TOLINK_OSS_ENDPOINT:}
  security:
    permit-api-docs: false
